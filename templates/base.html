{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{% endblock description %}">

    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static "/css/styles.css" %}">
    <script src="{% static "/js/tailwind.js" %}"></script>
</head>

<body class="bg-dark text-light min-h-screen">
    <header class="bg-gray-900 border-b border-gray-800 py-4 px-6 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-r from-primary to-secondary flex items-center justify-center">
                <span class="font-bold text-white">{{ user.profile.initials|default:"JD" }}</span>
            </div>
            <div>
                <p class="font-semibold">{{ user.username|default:"JohnDoe" }}</p>
                <p class="text-xs text-gray-400">{{ user.profile.title|default:"Level 12 Explorer" }}</p>
            </div>
        </div>

        <div class="hidden md:block">
            {% include "include/menu.html" %}
        </div>

        <div class="flex items-center space-x-4">
            <button class="p-2 rounded-full hover:bg-gray-800 transition">
                <i data-feather="bell" class="w-5 h-5"></i>
            </button>
            <button class="p-2 rounded-full hover:bg-gray-800 transition">
                <i data-feather="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4">
        {% block content %}
        {% endblock content %}
    </main>

    <script>
        feather.replace();
    </script>
</body>
</html>
