<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <meta name="description" content="Страница регистрации пользователя">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .bg-dark {
            background-color: #121212;
        }
        .text-light {
            color: #ffffff;
        }
        .gradient-bg {
            background: linear-gradient(90deg, #4F46E5, #7C3AED);
        }
    </style>
</head>
<body class="bg-dark text-light min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Форма регистрации -->
        <div class="bg-gray-900 rounded-xl p-6 shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-center">Регистрация</h2>
            
            <form id="registrationForm" class="space-y-4">
                <div>
                    <label for="login" class="block text-sm font-medium mb-1">Login</label>
                    <input type="text" id="login" name="login" 
                           class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Введите логин" required>
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">Mail</label>
                    <input type="email" id="email" name="email" 
                           class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Введите email" required>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" name="password" 
                           class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                           placeholder="Введите пароль" required>
                </div>
                
                <button type="submit" 
                        class="w-full py-2 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-md hover:from-indigo-700 hover:to-purple-700 transition duration-300 font-medium">
                    Sign in
                </button>
            </form>
        </div>
        
        <!-- Форма проверки почты (скрыта по умолчанию) -->
        <div id="verificationForm" class="bg-gray-900 rounded-xl p-6 shadow-lg mt-6 hidden">
            <h2 class="text-xl font-bold mb-2 text-center">Регистрация</h2>
            <h3 class="text-lg font-semibold mb-1 text-center">Проверьте свою почту</h3>
            <p class="text-sm text-gray-400 mb-4 text-center">Вам придёт код на почту</p>
            
            <div class="flex justify-center space-x-2 mb-4">
                <input type="text" maxlength="1" class="w-10 h-10 text-center bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" pattern="[0-9]">
                <input type="text" maxlength="1" class="w-10 h-10 text-center bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" pattern="[0-9]">
                <input type="text" maxlength="1" class="w-10 h-10 text-center bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" pattern="[0-9]">
                <input type="text" maxlength="1" class="w-10 h-10 text-center bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" pattern="[0-9]">
                <input type="text" maxlength="1" class="w-10 h-10 text-center bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" pattern="[0-9]">
                <input type="text" maxlength="1" class="w-10 h-10 text-center bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" pattern="[0-9]">
            </div>
            
            <button type="button" 
                    class="w-full py-2 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-md hover:from-indigo-700 hover:to-purple-700 transition duration-300 font-medium">
                Sign in
            </button>
        </div>
    </div>

    <script>
        // Обработка формы регистрации
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Здесь можно добавить валидацию и отправку данных
            
            // Показываем форму проверки почты
            document.getElementById('registrationForm').classList.add('hidden');
            document.getElementById('verificationForm').classList.remove('hidden');
            
            // Автоматически фокусируем первое поле ввода кода
            document.querySelectorAll('#verificationForm input')[0].focus();
        });
        
        // Обработка ввода кода (автоматический переход между полями)
        const codeInputs = document.querySelectorAll('#verificationForm input');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });
        
        // Инициализация Feather Icons
        feather.replace();
    </script>
</body>
</html>
