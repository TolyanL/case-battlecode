{% extends "base.html" %}

{% block title %}Регистрация{% endblock title %}
{% block description %}Создайте новый аккаунт.{% endblock description %}

{% block content %}
<div class="flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Создать аккаунт</h2>
        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium mb-2">Почта</label>
                <input type="text" id="email" name="email" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium mb-2">Имя пользователя</label>
                <input type="text" id="username" name="username" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label for="password1" class="block text-sm font-medium mb-2">Пароль</label>
                <input type="password" id="password1" name="password1" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label for="password2" class="block text-sm font-medium mb-2">Введите пароль еще раз</label>
                <input type="password" id="password2" name="password2" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-300">Зарегистрироваться</button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-sm text-blue-400 hover:underline">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>
{% endblock content %}
